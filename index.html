/* ============================= PHOTO SLOTS ============================= */

/* Distribute each entry's photos through its prose so text and images read as
   one article. Runs before hydration, so the slots still fill normally. */
function weaveGalleries(root){
  root.querySelectorAll('.entry-body').forEach(body=>{
    const gallery = body.querySelector('.gallery');
    const essay   = body.querySelector('.essay');
    if(!gallery || !essay) return;

    const slots = [...gallery.querySelectorAll('.slot')];
    if(!slots.length){ gallery.remove(); return; }
    gallery.remove();

    const paras = [...essay.querySelectorAll(':scope > p')];

    /* Spread every photo through the prose, alternating sides. Nothing is ever
       parked in a row at the end — each one sits beside text it belongs to. */
    slots.forEach((slot, i)=>{
      const fig = document.createElement('figure');
      fig.className = 'fig ' + (i % 2 === 0 ? 'right' : 'left');
      slot.classList.remove('wide');
      fig.appendChild(slot);

      if(!paras.length){ essay.appendChild(fig); return; }
      // spread across the whole piece rather than clustering at the top
      const at = Math.min(paras.length - 1, Math.floor(i * paras.length / slots.length));
      const target = paras[at];
      essay.insertBefore(fig, target);      // before the paragraph, so text wraps around it
    });
  });
}

function hydrateSlots(){
  pageBody.querySelectorAll('.slot').forEach(slot=>{
    const base=slot.dataset.src; if(!base) return;
    slot.innerHTML=`<span class="ph-ico">▦</span><span class="ph-name">Add ${base}.jpg</span><span class="ph-hint">drop this image in the folder</span>`;
    tryImage([base+'.jpg',base+'.jpeg',base+'.png',base+'.webp'], img=>{
      slot.classList.add('filled'); img.alt=base; img.loading='lazy';
      slot.innerHTML=''; slot.appendChild(img);
      /* Every photo sits in an identical 4:3 frame (see .fig .slot in the CSS) so
         the sections stay visually consistent. */
    });
  });
}
const IMG_SRC = new Map();      // base -> resolved url, or null if the file isn't there

/* Resolve a photo's real URL once, then reuse it. Decoding happens off the main
   thread so swapping the image in never stutters the running transition. */
function tryImage(list,cb){
  const base = String(list[0]).replace(/\.(jpg|jpeg|png|webp)$/i,'');

  const deliver = (src)=>{
    const img = new Image();
    img.decoding = 'async';
    img.src = src;
    if(img.decode){ img.decode().then(()=>cb(img)).catch(()=>{ if(img.complete) cb(img); }); }
    else if(img.complete){ cb(img); }
    else { img.onload = ()=>cb(img); }
  };

  if(IMG_SRC.has(base)){
    const hit = IMG_SRC.get(base);
    if(hit) deliver(hit);
    return;                                   // known-missing: don't re-probe
  }

  let i=0;
  (function attempt(){
    if(i>=list.length){ IMG_SRC.set(base, null); return; }
    const probe = new Image();
    probe.onload  = ()=>{ IMG_SRC.set(base, probe.src); deliver(probe.src); };
    probe.onerror = ()=>{ i++; attempt(); };
    probe.src = list[i];
  })();
}


/* Resolve one photo, reporting either its URL or null. tryImage stays silent on
   failure, which forced the journal to guess with a timeout — and that dropped
   real photos whenever loading ran slow. This never guesses. */
function resolveImage(base){
  if(IMG_SRC.has(base)) return Promise.resolve(IMG_SRC.get(base));
  const exts = ['.jpg','.jpeg','.png','.webp'];
  return new Promise(resolve=>{
    let i = 0;
    (function attempt(){
      if(i >= exts.length){ IMG_SRC.set(base, null); resolve(null); return; }
      const probe = new Image();
      probe.onload  = ()=>{ IMG_SRC.set(base, probe.src); resolve(probe.src); };
      probe.onerror = ()=>{ i++; attempt(); };
      probe.src = base + exts[i];
    })();
  });
}

/* Warm every section's photos in the background once the board is up, so the
   first open of each tile is as smooth as every one after it. */
function warmSectionPhotos(){
  const bases = new Set();
  document.querySelectorAll('template[data-page]').forEach(tpl=>{
    tpl.content.querySelectorAll('.slot,.a-slot').forEach(el=>{
      if(el.dataset.src) bases.add(el.dataset.src);
    });
  });
  const queue = [...bases];
  // plain timers, not requestIdleCallback: idle callbacks are throttled (or never
  // fire) on some browsers, which left the cache cold and pushed the whole cost
  // onto the first click instead.
  const step = ()=>{
    if(!queue.length) return;
    const base = queue.shift();
    tryImage([base+'.jpg',base+'.jpeg',base+'.png',base+'.webp'], ()=>{});
    setTimeout(step, 45);
  };
  step();
}

let showItems = [], showIdx = 0, showToken = 0;

function hydrateAlbum(){
  const stage = document.getElementById('showStage');
  const strip = document.getElementById('showStrip');
  const meta  = document.getElementById('showMeta');
  const count = document.getElementById('showCount');
  const prev  = document.getElementById('showPrev');
  const next  = document.getElementById('showNext');
  if(!stage) return;

  const token = ++showToken;          // a later visit invalidates this build
  showItems = []; showIdx = 0;
  strip.innerHTML = '';
  count.textContent = 'Loading…';

  // Resolve every candidate; missing files simply never call back, and the
  // resolver caches them so this stays cheap on repeat visits.
  const plan = [];
  JOURNAL_SOURCES.forEach(group=>group.bases.forEach(base=>plan.push({base, label:group.label})));

  Promise.all(plan.map(p=>resolveImage(p.base).then(src=>({...p, src}))))
    .then(results=>{
      if(token !== showToken) return;      // a newer visit owns the slideshow
      showItems = results.filter(r=>r.src)
                         .map(r=>({src:r.src, label:r.label, base:r.base}));
      buildStrip();
      showGo(0);
    });

  function buildStrip(){
    strip.innerHTML = '';
    showItems.forEach((it, i)=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role','tab');
      b.setAttribute('aria-label', it.label + ' photo ' + (i+1));
      const im = document.createElement('img');
      im.src = it.src; im.alt = ''; im.loading = 'lazy'; im.decoding = 'async';
      b.appendChild(im);
      b.addEventListener('click', ()=>showGo(i));
      strip.appendChild(b);
    });
  }

  function showGo(i){
    if(token !== showToken) return;
    if(!showItems.length){
      stage.querySelectorAll('img,.show-empty').forEach(e=>e.remove());
      const e = document.createElement('div');
      e.className = 'show-empty';
      e.textContent = 'No photos found yet — add images to the site folder and they will appear here.';
      stage.appendChild(e);
      meta.textContent = ''; count.textContent = '';
      prev.style.display = next.style.display = 'none';
      return;
    }
    prev.style.display = next.style.display = '';
    showIdx = (i + showItems.length) % showItems.length;
    const it = showItems[showIdx];

    stage.querySelectorAll('img,.show-empty').forEach(e=>e.remove());
    const im = document.createElement('img');
    im.alt = it.label; im.decoding = 'async'; im.src = it.src;
    stage.appendChild(im);
    requestAnimationFrame(()=>im.classList.add('on'));

    const cap = JOURNAL_CAPTIONS[it.base] || '';
    meta.innerHTML = '<b></b><span></span>';
    meta.querySelector('b').textContent = it.label;
    meta.querySelector('span').textContent = cap ? ' · ' + cap : '';
    count.textContent = (showIdx+1) + ' / ' + showItems.length;

    [...strip.children].forEach((b,bi)=>b.classList.toggle('on', bi===showIdx));
    const activeThumb = strip.children[showIdx];
    if(activeThumb) activeThumb.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  }

  prev.onclick = ()=>showGo(showIdx-1);
  next.onclick = ()=>showGo(showIdx+1);

  // arrow keys, only while the journal is the open page
  if(!window.__showKeys){
    window.__showKeys = true;
    document.addEventListener('keydown', e=>{
      if(!page.classList.contains('open')) return;
      if(!document.getElementById('showStage')) return;
      // call through the shared hook: this listener is registered once, so a
      // direct reference would stay bound to the first build's closure
      if(e.key==='ArrowLeft'){ e.preventDefault(); window.__showGo(showIdx-1); }
      if(e.key==='ArrowRight'){ e.preventDefault(); window.__showGo(showIdx+1); }
    });
  }
  window.__showGo = (i)=>showGo(i);
}

/* ============================= PHOTO FLURRY (box-open reveal) ============================= */
const FLURRY_POOL = [
  "about-1","about-2","about-3","about-4","about-5",
  "travel-nus-1","travel-nus-2","travel-nus-3","travel-nus-4","travel-nus-5","travel-nus-6","travel-nus-7",
  "travel-ntu-1","travel-ntu-2","travel-ntu-3","travel-ntu-4","travel-ntu-5","travel-ntu-6",
  "exp-accenture-1","exp-accenture-2","exp-accenture-3","exp-accenture-4",
  "exp-rsm-1","exp-rsm-2","exp-gt-1","exp-gt-2","exp-gt-3",
  "comm-absa-1","comm-absa-2","comm-absa-3",
  "hobby-piano-1","hobby-piano-2","hobby-hiking-1","hobby-hiking-2"
];
const flurryEl = document.getElementById('flurry');
let flurryCache = null, flurryRunning = false;

/* Preload whatever actually exists on disk, so the flurry never shows a broken frame. */
function preloadFlurry(cb){
  if(flurryCache){ cb(flurryCache); return; }
  const found = [];
  let pending = FLURRY_POOL.length;
  if(!pending){ cb(found); return; }
  FLURRY_POOL.forEach(base=>{
    tryImage([base+'.jpg',base+'.jpeg',base+'.png',base+'.webp'], img=>{
      found.push({src:img.src, tall: img.naturalHeight > img.naturalWidth});
      if(--pending===0){ flurryCache = found; cb(found); }
    });
    // tryImage never calls back on total failure — guard with a timeout
    setTimeout(()=>{ if(pending>0 && !flurryCache){ /* no-op, resolved below */ } }, 0);
  });
  // hard fallback so a few missing files can't stall the intro
  setTimeout(()=>{ if(!flurryCache){ flurryCache = found; cb(found); } }, 900);
}

const rand = (a,b)=> a + Math.random()*(b-a);

function runFlurry(){
  if(flurryRunning) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  flurryRunning = true;

  preloadFlurry(pool=>{
    if(!pool.length){ flurryRunning=false; return; }

    const COUNT = Math.min(pool.length, 12);
    const picks = drawFromQueue(pool, COUNT);

    flurryEl.innerHTML = '';
    flurryEl.classList.add('on');

    // warm golden bloom out of the open box
    const glow = document.createElement('div');
    glow.className = 'fl-glow';
    flurryEl.appendChild(glow);
    glow.animate([
      {opacity:0, transform:'translate(-50%,-50%) scale(.15)'},
      {opacity:.8, transform:'translate(-50%,-50%) scale(1)', offset:.28},
      {opacity:0,  transform:'translate(-50%,-50%) scale(2)'}
    ], {duration:2400, easing:'cubic-bezier(.22,1,.36,1)', fill:'forwards'});

    // Build the cards first so we can measure them, then size the ring to fit.
    // (Hard-coded card sizes clipped the ring on small screens.)
    const cards = picks.map(p=>{
      const card = document.createElement('div');
      card.className = 'fl-card' + (p.tall ? ' tall' : '');
      const im = document.createElement('img');
      im.src = p.src; im.alt = '';
      card.appendChild(im);
      flurryEl.appendChild(card);
      return card;
    });

    let halfW = 0, halfH = 0;
    cards.forEach(c=>{
      const r = c.getBoundingClientRect();
      halfW = Math.max(halfW, r.width  / 2);
      halfH = Math.max(halfH, r.height / 2);
    });
    const pad = 30;   // absorbs the per-card position jitter (±14 / ±12)
    const Rx = (window.innerWidth  / 2 - halfW - pad) / 1.12;
    const Ry = (window.innerHeight / 2 - halfH - pad) / 0.90;
    const R  = Math.max(90, Math.min(Rx, Ry));

    cards.forEach((card, i)=>{
      const p = picks[i];

      // land on the perimeter of a pointy-top hexagon: 6 vertices + 6 edge midpoints
      const hp   = hexPoint(i / COUNT, R);
      const x1   = hp.x * 1.12 + rand(-14, 14);   // slightly wider than tall to fill the frame
      const y1   = hp.y * 0.90 + rand(-12, 12);
      const rot1 = rand(-22, 22);
      const drift = rand(1.05, 1.12);             // gentle push outward while it hangs

      const stagger = i * 200;                    // ~2.2s of photos streaming out, one by one
      const OUT = 1250, HOLD = 900, IN = 780;     // 2.93s per card

      // NOTE: easing lives on each keyframe. A single top-level easing would
      // compress the whole burst/hold/collapse into the first fraction of the run.
      card.animate([
        { offset:0,
          opacity:0,
          transform:`translate(-50%,-50%) translate(0px,0px) rotate(${rand(-14,14)}deg) scale(.10)`,
          easing:'cubic-bezier(.17,.82,.3,1)' },     // drift up out of the box
        { offset:.30,
          opacity:1,
          transform:`translate(-50%,-50%) translate(${x1*.58}px,${y1*.58}px) rotate(${rot1*.55}deg) scale(.88)`,
          easing:'cubic-bezier(.22,1,.36,1)' },      // ease into its place on the hexagon
        { offset:.46,
          opacity:1,
          transform:`translate(-50%,-50%) translate(${x1}px,${y1}px) rotate(${rot1}deg) scale(1)`,
          easing:'ease-in-out' },                    // hold and float
        { offset:.76,
          opacity:1,
          transform:`translate(-50%,-50%) translate(${x1*drift}px,${y1*drift}px) rotate(${rot1*1.06}deg) scale(1.02)`,
          easing:'cubic-bezier(.5,0,.85,.4)' },      // draw back toward the island
        { offset:1,
          opacity:0,
          transform:`translate(-50%,-50%) translate(${x1*.05}px,${y1*.05}px) rotate(${rot1*.15}deg) scale(.14)` }
      ], {
        duration: OUT + HOLD + IN,
        delay: stagger,
        easing: 'linear',
        fill: 'forwards'
      });
    });

    // last card starts at 11*200=2200 and runs 2930 -> ~5.1s total
    const total = (COUNT - 1) * 200 + 2930;
    setTimeout(()=>{ flurryEl.classList.remove('on'); }, total - 500);
    setTimeout(()=>{ flurryEl.innerHTML=''; flurryRunning=false; }, total + 250);
  });
}

/* A point on the perimeter of a pointy-top hexagon. t in [0,1) walks the
   whole outline, so 12 evenly spaced values land on the 6 corners and the
   6 edge midpoints — the same silhouette as the board itself. */
function hexPoint(t, R){
  const V = [];
  for(let k=0;k<6;k++){
    const a = (Math.PI/3)*k - Math.PI/2;      // pointy-top, matching the board
    V.push({x:Math.cos(a)*R, y:Math.sin(a)*R});
  }
  const seg = Math.floor(t*6) % 6;
  const f   = t*6 - Math.floor(t*6);
  const a = V[seg], b = V[(seg+1)%6];
  return { x: a.x + (b.x-a.x)*f, y: a.y + (b.y-a.y)*f };
}

/* Rotating queue: shuffle the whole library, hand out COUNT photos per open,
   and only reshuffle once every photo has had a turn. That way each opening
   shows a different set instead of re-rolling at random. */
let flurryQueue = [];
function drawFromQueue(pool, count){
  const out = [];
  while(out.length < count){
    if(!flurryQueue.length){
      flurryQueue = pool.slice();
      for(let i=flurryQueue.length-1;i>0;i--){        // Fisher-Yates
        const j = Math.floor(Math.random()*(i+1));
        [flurryQueue[i], flurryQueue[j]] = [flurryQueue[j], flurryQueue[i]];
      }
      // avoid an immediate repeat across the shuffle boundary
      if(out.length && flurryQueue[0] && flurryQueue[0].src === out[out.length-1].src){
        flurryQueue.push(flurryQueue.shift());
      }
    }
    out.push(flurryQueue.shift());
  }
  return out;
}

function resetFlurry(){
  flurryEl.classList.remove('on');
  flurryEl.innerHTML='';
  flurryRunning=false;
}

const closeBoxBtn=document.getElementById('closeBoxBtn');
function closeTheBox(){
  // if a section page is open, close it first
  if(page.classList.contains('open')){ page.classList.remove('open'); page.setAttribute('aria-hidden','true'); document.body.style.overflow=''; document.body.classList.remove('reading'); }
  if(location.hash){ history.replaceState('', '', location.pathname + location.search); }
  // reset the tiles so they re-deal next time the box opens
  board.classList.remove('reveal');
  board.querySelectorAll('.hex').forEach(h=>{ h.style.removeProperty('animation'); h.style.opacity=''; });
  // bring the box back and close the lid down onto it
  intro.style.display='';
  stage.classList.remove('zoom');
  gameBox.classList.remove('opening');
  gameBox.classList.add('closing');            // lid descends and settles
  openBtn.disabled=false;
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ intro.classList.remove('gone'); }); });
  const onEnd=()=>{ gameBox.classList.remove('closing'); gameBox.removeEventListener('animationend', onEnd); };
  gameBox.addEventListener('animationend', onEnd);
  window.scrollTo(0,0);
}
closeBoxBtn.addEventListener('click', ()=>{ resetFlurry(); closeTheBox(); });
